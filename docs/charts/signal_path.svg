<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>T10S keep-alive signal path</title>
  <desc>The keep-alive pulse runs on its own discreet path (PC to USB isolator to hi-res DAC to the
  sub's unbalanced RCA input) while the listening path runs from the audio interface into the
  balanced XLR inputs. The T10S sums both, and its auto-sense detector sees the sum.</desc>

  <rect width="1000" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009E73"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- ============ connectors ============ -->
  <!-- keep-alive path (green) -->
  <path d="M100,185 H120 V95 H138" fill="none" stroke="#009E73" stroke-width="2.4"
        marker-end="url(#arrowGreen)"/>
  <path d="M290,95 H332" fill="none" stroke="#009E73" stroke-width="2.4"
        marker-end="url(#arrowGreen)"/>
  <path d="M490,95 H572" fill="none" stroke="#009E73" stroke-width="2.4"
        marker-end="url(#arrowGreen)"/>

  <!-- listening path (blue) -->
  <path d="M100,185 H120 V285 H138" fill="none" stroke="#0072B2" stroke-width="2.4"
        marker-end="url(#arrowBlue)"/>
  <path d="M290,285 H572" fill="none" stroke="#0072B2" stroke-width="2.4"
        marker-end="url(#arrowBlue)"/>

  <!-- sub to monitors -->
  <path d="M782,190 H822" fill="none" stroke="#444444" stroke-width="2.4"
        marker-end="url(#arrowInk)"/>

  <!-- connector labels, clear above the box tops -->
  <g font-size="11" fill="#555555" text-anchor="middle">
    <text x="311" y="48">USB A→C</text>
    <text x="531" y="48">3.5 mm → RCA</text>
    <text x="431" y="274">XLR, balanced · knob-controlled</text>
  </g>

  <!-- ============ nodes ============ -->
  <!-- PC -->
  <rect x="16" y="149" width="84" height="72" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="1.6"/>
  <text x="58" y="181" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">PC</text>
  <text x="58" y="199" font-size="10.5" fill="#555555" text-anchor="middle">Windows</text>

  <!-- isolator -->
  <rect x="138" y="59" width="152" height="72" rx="8" fill="#E6F5F0" stroke="#009E73" stroke-width="1.8"/>
  <text x="214" y="88" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">USB isolator</text>
  <text x="214" y="105" font-size="10.5" fill="#555555" text-anchor="middle">SH-G01L · 480 Mbps</text>
  <text x="214" y="120" font-size="10.5" fill="#555555" text-anchor="middle">high speed</text>

  <!-- DAC -->
  <rect x="332" y="59" width="158" height="72" rx="8" fill="#E6F5F0" stroke="#009E73" stroke-width="1.8"/>
  <text x="411" y="88" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">FiiO KA11</text>
  <text x="411" y="105" font-size="10.5" fill="#555555" text-anchor="middle">hi-res DAC · 384 kHz</text>
  <text x="411" y="120" font-size="10.5" fill="#555555" text-anchor="middle">pulse only, fixed level</text>

  <!-- interface -->
  <rect x="138" y="249" width="152" height="72" rx="8" fill="#E3F0F8" stroke="#0072B2" stroke-width="1.8"/>
  <text x="214" y="278" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Audient iD4</text>
  <text x="214" y="295" font-size="10.5" fill="#555555" text-anchor="middle">audio interface</text>
  <text x="214" y="310" font-size="10.5" fill="#555555" text-anchor="middle">music</text>

  <!-- T10S -->
  <rect x="578" y="45" width="204" height="290" rx="10" fill="#FCFCFC" stroke="#222222" stroke-width="2"/>
  <text x="680" y="76" font-size="13.5" font-weight="bold" fill="#222222" text-anchor="middle">Adam Audio T10S</text>

  <!-- input ports -->
  <rect x="590" y="88" width="180" height="34" rx="6" fill="#E6F5F0" stroke="#009E73" stroke-width="1.4"/>
  <text x="680" y="110" font-size="11" fill="#222222" text-anchor="middle">unbalanced in (RCA)</text>

  <rect x="590" y="262" width="180" height="34" rx="6" fill="#E3F0F8" stroke="#0072B2" stroke-width="1.4"/>
  <text x="680" y="284" font-size="11" fill="#222222" text-anchor="middle">balanced in (XLR)</text>

  <!-- summing junction -->
  <path d="M680,122 V163" fill="none" stroke="#009E73" stroke-width="2"/>
  <path d="M680,262 V218" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="680" cy="192" r="26" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="680" y="200" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">+</text>
  <text x="680" y="314" font-size="10.5" fill="#555555" text-anchor="middle">auto-sense detector sees the sum</text>
  <text x="680" y="329" font-size="10.5" fill="#555555" text-anchor="middle">houses the system crossover</text>

  <!-- monitors -->
  <rect x="822" y="149" width="162" height="82" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="1.6"/>
  <text x="903" y="180" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">T-series monitors</text>
  <text x="903" y="198" font-size="10.5" fill="#555555" text-anchor="middle">T5V / T7V / T8V</text>
  <text x="903" y="213" font-size="10.5" fill="#555555" text-anchor="middle">25 kHz tweeter ceiling</text>

  <!-- ============ legend ============ -->
  <g font-size="11.5">
    <rect x="138" y="358" width="26" height="3" fill="#009E73"/>
    <text x="172" y="363" fill="#333333">keep-alive pulse — its own discreet path, never carries music</text>
    <rect x="578" y="358" width="26" height="3" fill="#0072B2"/>
    <text x="612" y="363" fill="#333333">listening path — untouched</text>
  </g>
</svg>
